version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: womens-tales-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: womenstales
      MYSQL_USER: adminWomensTales
      MYSQL_PASSWORD: "adminWomensTalesPassword$#$"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - womens-tales-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: womens-tales-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/womenstales?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: adminWomensTales
      SPRING_DATASOURCE_PASSWORD: "adminWomensTalesPassword$#$"
    networks:
      - womens-tales-net

volumes:
  mysql_data:

networks:
  womens-tales-net:
