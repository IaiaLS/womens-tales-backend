name: CI/CD - Build, Test & Docker

on:
  pull_request:
    branches: [ main, develop ]  # roda só validação
  push:
    branches: [ main ]           # builda imagem e faz deploy quando merge na main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build com Maven
        run: mvn -B clean compile

      - name: Rodar testes
        run: mvn -B test

      - name: Cobertura (Jacoco)
        run: mvn -B verify

      - name: Salvar relatório Jacoco
        uses: actions/upload-artifact@v3
        with:
          name: cobertura-relatorio
          path: target/site/jacoco/

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test  # só roda se testes passarem
    if: github.ref == 'refs/heads/main' # só na branch main

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Login no DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build imagem
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/womens-tales-backend:latest .

      - name: Push imagem
        run: docker push ${{ secrets.DOCKER_USERNAME }}/womens-tales-backend:latest
