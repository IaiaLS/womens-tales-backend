name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build com Maven
        run: mvn clean package -DskipTests=false

      - name: Rodar testes
        run: mvn test

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Login no DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build imagem
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/womens-tales-backend:latest .

      - name: Push imagem
        run: docker push ${{ secrets.DOCKER_USERNAME }}/womens-tales-backend:latest
